# Dark Mode (OLED) fintech theme, from the ui-ux-pro-max design system for a
# financial research tool: deep navy, near-white text, amber primary, gold and violet
# accents, IBM Plex Sans throughout. Dark only (the design system's anti-pattern list
# rules out light backgrounds). Chart colors live in brief/ui/charts.py and were
# checked for colorblind separation and contrast against this background.

[theme]
base = "dark"
# Google Fonts as "<family>:<css url>". No fallback list (Streamlit appends it to the
# URL) and no family names ending in a digit (they're emitted unquoted: invalid CSS).
font = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFont = "IBM Plex Sans:https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
headingFontWeights = 600
baseRadius = "0.6rem"
showSidebarBorder = false
linkUnderline = false

primaryColor = "#F59E0B"            # amber
backgroundColor = "#0F172A"         # deep navy
secondaryBackgroundColor = "#1E293B"
textColor = "#F8FAFC"
linkColor = "#FBBF24"               # gold
borderColor = "#334155"
dataframeBorderColor = "#334155"
dataframeHeaderBackgroundColor = "#1E293B"
greenColor = "#34D399"
redColor = "#FB7185"
blueColor = "#60A5FA"
yellowColor = "#FBBF24"
violetColor = "#A78BFA"
grayTextColor = "#CBD5E1"
grayBackgroundColor = "#CBD5E11F"

[server]
headless = true
